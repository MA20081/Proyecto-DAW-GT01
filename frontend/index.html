<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediAgenda</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar">
    <span class="logo">🏥 MediAgenda</span>
    <ul class="nav-links">
      <li><a href="#listado">Inicio</a></li>
      <li><a href="#nueva-cita">Nueva Cita</a></li>
    </ul>
  </nav>

  <main>

    <!-- ===================== GET: Listado (Oscar Peraza) ===================== -->
    <section id="listado">
      <div class="section-header">
        <h2>Citas médicas registradas</h2>
        <span id="total-citas" class="badge-total">0 registros</span>
      </div>
      <div class="table-wrapper">
        <table id="tabla-citas">
          <thead>
            <tr>
              <th>ID</th>
              <th>Paciente</th>
              <th>Doctor</th>
              <th>Especialidad</th>
              <th>Fecha y Hora</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla"></tbody>
        </table>
      </div>
      <div id="toast" class="toast hidden"></div>
    </section>

    <!-- ===================== POST: Nueva cita (Geovanni Ibáñez) ===================== -->
    <section id="nueva-cita">
      <div class="section-header">
        <h2>Nueva cita</h2>
        <span class="badge-endpoint">POST /api/citas</span>
      </div>

      <form id="form-crear-cita" class="formulario">

        <div class="form-grupo">
          <label for="nombrePaciente">Nombre del paciente</label>
          <input type="text" id="nombrePaciente" placeholder="Ej. María López" required />
        </div>

        <div class="form-grupo">
          <label for="nombreDoctor">Nombre del doctor</label>
          <input type="text" id="nombreDoctor" placeholder="Ej. Dr. Carlos Rivas" required />
        </div>

        <div class="form-grupo">
          <label for="especialidad">Especialidad</label>
          <select id="especialidad" required>
            <option value="">-- Seleccionar --</option>
            <option value="Medicina General">Medicina General</option>
            <option value="Pediatría">Pediatría</option>
            <option value="Cardiología">Cardiología</option>
            <option value="Dermatología">Dermatología</option>
            <option value="Neurología">Neurología</option>
            <option value="Traumatología">Traumatología</option>
          </select>
        </div>

        <div class="form-grupo">
          <label for="fechaHora">Fecha y hora</label>
          <input type="datetime-local" id="fechaHora" required />
        </div>

        <div class="form-grupo">
          <label for="estado">Estado</label>
          <select id="estado" required>
            <option value="PENDIENTE">PENDIENTE</option>
            <option value="CONFIRMADA">CONFIRMADA</option>
            <option value="CANCELADA">CANCELADA</option>
          </select>
        </div>

        <button type="submit" class="btn-guardar">💾 Guardar cita</button>

      </form>
    </section>

    <!-- ===================== PUT: Modal de edición (Wilber García) ===================== -->
    <div id="modal-editar" class="modal hidden">
      <div class="modal-contenido">

        <div class="modal-titulo">
          <h3>Editar cita</h3>
          <span class="badge-endpoint">PUT /api/citas/<span id="edit-id-display"></span></span>
        </div>

        <form id="form-editar-cita" class="formulario">

          <input type="hidden" id="edit-id" />

          <div class="form-grupo">
            <label for="edit-paciente">Nombre del paciente</label>
            <input type="text" id="edit-paciente" required />
          </div>

          <div class="form-grupo">
            <label for="edit-doctor">Nombre del doctor</label>
            <input type="text" id="edit-doctor" required />
          </div>

          <div class="form-grupo">
            <label for="edit-especialidad">Especialidad</label>
            <select id="edit-especialidad" required>
              <option value="Medicina General">Medicina General</option>
              <option value="Pediatría">Pediatría</option>
              <option value="Cardiología">Cardiología</option>
              <option value="Dermatología">Dermatología</option>
              <option value="Neurología">Neurología</option>
              <option value="Traumatología">Traumatología</option>
            </select>
          </div>

          <div class="form-grupo">
            <label for="edit-fecha-hora">Fecha y hora</label>
            <input type="datetime-local" id="edit-fecha-hora" required />
          </div>

          <div class="form-grupo">
            <label for="edit-estado">Estado</label>
            <select id="edit-estado" required>
              <option value="PENDIENTE">PENDIENTE</option>
              <option value="CONFIRMADA">CONFIRMADA</option>
              <option value="CANCELADA">CANCELADA</option>
            </select>
          </div>

          <p id="mensaje-exito-editar" class="mensaje-exito hidden"></p>

          <div class="modal-acciones">
            <button type="submit" class="btn-guardar">✅ Guardar cambios</button>
            <button type="button" id="btn-cerrar-modal" class="btn-cancelar">Cancelar</button>
          </div>

        </form>
      </div>
    </div>

    <!-- ===================== DELETE: Confirmación (Francisco Calderón) ===================== -->
    <div id="modal-eliminar" class="modal hidden">
      <div class="modal-contenido">
        <h3 style="margin-bottom: 0.75rem; color: #dc2626;">⚠️ Confirmar eliminación</h3>
        <p id="texto-confirmar-eliminar">¿Eliminar esta cita?</p>
        <div class="modal-acciones">
          <button id="btn-confirmar-eliminar" class="btn-eliminar">Sí, eliminar</button>
          <button id="btn-cancelar-eliminar" class="btn-cancelar">Cancelar</button>
        </div>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/citas.js"></script>
  <script src="js/listado.js"></script>
  <script src="js/crear.js"></script>
  <script src="js/editar.js"></script>
  <script src="js/eliminar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/eliminar.js"></script>

</body>
</html>
