<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediAgenda</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar">
    <span class="logo">🏥 MediAgenda</span>
    <ul class="nav-links">
      <li><a href="#listado">Inicio</a></li>
      <li><a href="#nueva-cita">Nueva Cita</a></li>
    </ul>
  </nav>

  <main>

    <!-- GET: Listado -->
    <section id="listado">
      <div class="section-header">
        <h2>Citas médicas registradas</h2>
        <span id="total-citas" class="badge-total">0 registros</span>
      </div>
      <div class="table-wrapper">
        <table id="tabla-citas">
          <thead>
            <tr>
              <th>ID</th>
              <th>Paciente</th>
              <th>Doctor</th>
              <th>Especialidad</th>
              <th>Fecha y Hora</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla"></tbody>
        </table>
      </div>
      <div id="toast" class="toast hidden"></div>
    </section>

    <!-- POST: Formulario nueva cita -->
    <section id="nueva-cita">
      <h2>Nueva cita</h2>
      <p class="seccion-pendiente">Formulario POST</p>
    </section>

    <!-- PUT: Modal edición -->
<div id="modal-editar" class="modal hidden">
      <div class="modal-contenido">
        <h2 id="titulo-edicion">Formulario de Edición</h2>
        
        <form id="form-editar-cita">
          <div class="form-group">
            <label>ID de la Cita:</label>
            <input type="text" id="edit-id" readonly style="background-color: #f3f3f3; cursor: not-allowed; font-weight: bold;">
          </div>

          <div class="form-group">
            <label for="edit-paciente">Nombre del Paciente:</label>
            <input type="text" id="edit-paciente" required>
          </div>

          <div class="form-group">
            <label for="edit-doctor">Nombre del Doctor:</label>
            <input type="text" id="edit-doctor" required>
          </div>

          <div class="form-group">
            <label for="edit-especialidad">Especialidad:</label>
            <select id="edit-especialidad" required>
              <option value="Medicina General">Medicina General</option>
              <option value="Pediatría">Pediatría</option>
              <option value="Cardiología">Cardiología</option>
              <option value="Dermatología">Dermatología</option>
              <option value="Neurología">Neurología</option>
              <option value="Traumatología">Traumatología</option>
            </select>
          </div>

          <div class="form-group">
            <label for="edit-fecha-hora">Fecha y Hora:</label>
            <input type="datetime-local" id="edit-fecha-hora" step="60" required>
          </div>

          <div class="form-group">
            <label for="edit-estado">Estado:</label>
            <select id="edit-estado" required>
              <option value="PENDIENTE">PENDIENTE</option>
              <option value="CONFIRMADA">CONFIRMADA</option>
              <option value="CANCELADA">CANCELADA</option>
            </select>
          </div>

          <div id="mensaje-exito-editar" class="alert-success hidden" style="color: #155724; background-color: #d4edda; padding: 10px; margin: 15px 0; text-align: center; border-radius: 4px; font-weight: bold; border: 1px solid #c3e6cb;"></div>

          <div class="modal-acciones">
            <button type="submit" class="btn-guardar" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;">Guardar Cambios</button>
            <button type="button" id="btn-cerrar-modal" class="btn-cancelar">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- DELETE: Confirmación -->
    <div id="modal-eliminar" class="modal hidden">
      <div class="modal-contenido">
        <p id="texto-confirmar-eliminar">¿Eliminar esta cita?</p>
        <div class="modal-acciones">
          <button id="btn-confirmar-eliminar" class="btn-eliminar">Si, eliminar</button>
          <button id="btn-cancelar-eliminar" class="btn-cancelar">Cancelar</button>
        </div>
      </div>
    </div>

  </main>

  <script src="js/citas.js"></script>
  <script src="js/listado.js"></script>
  <script src="js/editar.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
