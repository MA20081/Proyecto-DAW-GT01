spring.application.name=mediagenda

# =====================
# Configuracion PostgreSQL
# Usa variable de entorno DB_HOST (docker) o localhost por defecto
# =====================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/mediagenda_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# =====================
# Configuracion JPA
# none = Hibernate no toca las tablas, el schema.sql las gestiona
# =====================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicializar schema.sql siempre al arrancar
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# =====================
# Configuracion Swagger
# =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =====================
# CORS — permite peticiones del frontend
# =====================
spring.web.cors.allowed-origins=*
